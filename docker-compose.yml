name: mundialito

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Mundialito#Dev2026}
    ports:
      - "1434:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"

  api:
    build:
      context: .
      dockerfile: src/Mundialito.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Mundialito: "Server=db,1433;Database=Mundialito;User Id=sa;Password=${DB_PASSWORD:-Mundialito#Dev2026};TrustServerCertificate=True"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      jaeger:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
        
volumes:
  db-data: